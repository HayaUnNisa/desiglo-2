<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050a14" />
    <meta
      name="description"
      content="Desiglo designs and develops distinctive websites for ambitious businesses. Explore our work, services, and transparent project pricing."
    />
        <script>
      try {
        var t = localStorage.getItem("desiglo-theme");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      } catch (e) {}
    </script>
    <title>Desiglo - Web Design &amp; Development</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
